# Grouped so an ecosystem's routine bumps arrive as ONE pull request instead of
# one per dependency. Ungrouped, this fleet opened 1,461 PRs across 176 repos,
# none of which had any CI signal because the only workflow fired on push to
# main. Both halves of that are fixed here: the grouping below, and the
# `pull_request` trigger in .github/workflows/deploy.yml.
#
# Majors are deliberately left OUT of the npm group. When the 2026-08-18 backlog
# was landed by hand, 109 bumps had to be held back and they were overwhelmingly
# majors; a breaking major inside the grouped PR makes the whole thing
# unmergeable, which is exactly the hand-unpicking this exists to prevent.
#
# github-actions majors ARE grouped: the checkout v4->v7, setup-node v4->v7 and
# Pages v5/v6 jumps were verified green across all 176 repos on 2026-08-18.
#
# The minor/patch group and the actions group auto-merge once this lab's own
# gate passes on the PR -- see the dependabot-auto-merge job in deploy.yml,
# which also dispatches the deploy afterwards, because a merge made with
# GITHUB_TOKEN raises no push event.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
