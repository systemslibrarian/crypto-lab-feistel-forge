name: Deploy to GitHub Pages

# One workflow, three triggers, and each one is load-bearing:
#
#   push          — the ordinary path: land on main, gate, publish.
#   pull_request  — the gate has to JUDGE pull requests, or Dependabot opens
#                   bumps with no CI signal on any of them. This fleet reached
#                   1,461 open PRs that way.
#   workflow_dispatch — a merge performed with secrets.GITHUB_TOKEN raises no
#                   push event (GitHub suppresses them so workflows cannot
#                   retrigger themselves), so the auto-merge job below has to
#                   ask for the deploy explicitly. Without this trigger the
#                   bump lands on main and the live site keeps serving the
#                   previous build with no red run anywhere to say so.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # NOT a bare `pages`: with cancel-in-progress, a PR run would cancel a live
  # main deploy.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The WHOLE suite gates the publish, not just the a11y half. A sweep of
      # this fleet found 29 repos whose deploy job ran `test:a11y` alone, so
      # their cryptographic suites never blocked anything.
      - name: Unit tests (Vitest, incl. 598 CAVP known-answer assertions)
        run: npm test

      - name: Build (typecheck gates the build)
        run: npm run build

      # Deliberately NOT `--with-deps`. That flag runs an apt install step that
      # wedged 547 CI runs across this fleet, and the ubuntu-latest image
      # already carries the shared libraries Chromium needs.
      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Accessibility gate (axe-core, WCAG 2.1 A/AA, 1280px and 380px)
        run: npm run test:a11y

      - name: Claims suite (the page's numbers, re-derived independently)
        run: npm run test:claims

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    # A pull request is TESTED, never published. Note this is not
    # `== 'push'`: that would also skip workflow_dispatch, which is the one
    # trigger the post-merge deploy depends on — the dispatched run would
    # build, pass the gate, skip this job, and the site would never update.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Dependabot only. `needs: build` is the whole safety argument: a bump can
  # merge itself only once this lab's own gate — unit tests, typecheck, build,
  # the axe WCAG scan and the claims suite — has gone green on the PR. The gate
  # judges a bump far better than its version number does, so majors are
  # included here on purpose; one that actually breaks the lab fails the gate
  # and stays open for a human.
  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required by the deploy dispatch below. Without it `gh workflow run`
      # returns HTTP 403 "Resource not accessible by integration", the merged
      # bump never deploys, and a `|| echo` fallback hides it.
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed but the merge did not land after 3 attempts;"
            echo "::warning::leaving this PR open - Dependabot will rebase and retry."
            exit 0
          fi
          # See the trigger block: a GITHUB_TOKEN merge raises no push event, so
          # nothing would deploy the merged result. A workflow_dispatch through the
          # API is not suppressed. The dispatched run is this same gate-then-deploy
          # pipeline, so a bad merge still ships nothing.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "::warning::deploy dispatch failed; run deploy.yml by hand"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
